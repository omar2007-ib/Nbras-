[build]
  command = "python3 scripts/build_static.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # The login page includes a camera-based QR scanner.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
