<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>تسجيل الدخول | نبراس</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .auth-wrap{max-width:520px;margin:56px auto;padding:24px}
    .auth-card{background:#fff;border:1px solid #e6e2d9;border-radius:22px;padding:28px;box-shadow:0 16px 44px #15243b12}
    .auth-card label{display:block;margin:18px 0 8px;font-weight:700}
    .auth-card input{width:100%;padding:13px;border:1px solid #d7dce3;border-radius:12px;font:inherit}
    .auth-card button{margin-top:16px;width:100%;cursor:pointer}
    .auth-message{margin-top:14px;line-height:1.8}
    .muted{color:#64748b;font-size:.94rem}
  </style>
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card">
      <p class="eyebrow">نِبراس • منصة الاستعداد للقدرات</p>
      <h1>مرحباً بعودتك</h1>
      <p class="muted">سجّل الدخول برابط تحقق يُرسل إلى بريدك الإلكتروني.</p>
      <form id="sign-in-form">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" autocomplete="email" required placeholder="name@example.com">
        <button class="button button-primary" type="submit">إرسال رابط الدخول</button>
      </form>
      <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
      <p class="muted">تسجيل الدخول الحقيقي يحتاج إلى إعداد مشروع Supabase في assets/supabase-config.js.</p>
      <a href="index.html">العودة إلى الرئيسية</a>
    </section>
  </main>
  <script src="assets/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/auth.js"></script>
</body>
</html>
