name: Athar static smoke checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate public pages
        run: python scripts/validate_static_site.py
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Check responsive layouts and keyboard focus at common viewport widths
        run: python scripts/test_responsive_keyboard.py
      - name: Check MCQ answer-key isolation
        run: python scripts/check_mcq_security.py
