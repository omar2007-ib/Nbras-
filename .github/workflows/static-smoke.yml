name: Athar static smoke checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test accessible-name audit behavior
        run: python scripts/test_accessible_names.py
      - name: Check accessible names on HTML controls
        run: python scripts/check_accessible_names.py
      - name: Build and validate public pages
        run: python scripts/validate_static_site.py
      - name: Check MCQ answer-key isolation
        run: python scripts/check_mcq_security.py
