name: Athar site quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-site-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate HTML page metadata and local links
        run: python scripts/check_site.py
      - name: Run quiz regression checks
        run: python scripts/test_quiz_content.py
      - name: Verify LLM gateway and MCQ builder integration
        run: python scripts/test_llm_integration.py
      - name: Test MCQ provider response validation
        run: python scripts/test_mcq_generator_validation.py
      - name: Run MCQ and assistant security regression checks
        run: python scripts/check_mcq_security.py
      - name: Test assistant timeout and chat history handling
        run: python scripts/test_assistant_frontend.py
      - name: Build and validate deployment output
        run: python scripts/validate_static_site.py
